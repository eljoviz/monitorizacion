<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="260" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Decorative Grid / Lines -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.3">
    <line x1="50" y1="30" x2="900" y2="30"/>
    <line x1="50" y1="80" x2="900" y2="80"/>
    <line x1="50" y1="130" x2="900" y2="130"/>
    <line x1="50" y1="180" x2="900" y2="180"/>
    <line x1="50" y1="230" x2="900" y2="230"/>
    <line x1="150" y1="20" x2="150" y2="240"/>
    <line x1="350" y1="20" x2="350" y2="240"/>
    <line x1="550" y1="20" x2="550" y2="240"/>
    <line x1="750" y1="20" x2="750" y2="240"/>
  </g>

  <!-- Top bar dot decorations -->
  <circle cx="35" cy="28" r="6" fill="#ef4444" />
  <circle cx="55" cy="28" r="6" fill="#f59e0b" />
  <circle cx="75" cy="28" r="6" fill="#10b981" />

  <!-- Pulse / Monitor Wave Line -->
  <path d="M 520 130 L 590 130 L 610 90 L 630 170 L 650 110 L 670 145 L 685 130 L 890 130" 
        fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Main Title -->
  <text x="60" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    MONITORIZACIÓN EN LINUX
  </text>

  <!-- Subtitle -->
  <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Guía Práctica de Rendimiento: Procesos • Memoria y Disco • Tráfico de Red
  </text>

  <!-- Badges inside SVG -->
  <g transform="translate(62, 160)">
    <!-- Badge 1: ASIR -->
    <rect x="0" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="57" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">ASIR 2º CURSO</text>

    <!-- Badge 2: DevOps & SysAdmin -->
    <rect x="125" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="207" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">SYSADMIN &amp; DEVOPS</text>

    <!-- Badge 3: CLI Tools -->
    <rect x="300" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="365" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">CLI &amp; BASH SCRIPTS</text>
  </g>

  <!-- Footer hint -->
  <text x="62" y="222" font-family="monospace" font-size="13" fill="#64748b">
    $ top • ps aux • free -h • df -hT • vmstat • iostat • ss -tulpn • ip -s link
  </text>
</svg>
